# CTFd + MariaDB + Redis. CTFd is built from the pinned source in ./vendor/CTFd
# (scripts/fetch-ctfd.sh clones it), so no Docker Hub image tag has to exist.
services:
  ctfd:
    build:
      context: ./vendor/CTFd
    image: ctf-ai-agent/ctfd:local
    restart: unless-stopped
    ports:
      - "${CTFD_PORT:-80}:8000"
    environment:
      UPLOAD_FOLDER: /var/uploads
      DATABASE_URL: mysql+pymysql://ctfd:${DB_PASSWORD:?run scripts/init-env.sh}@db/ctfd
      REDIS_URL: redis://cache:6379
      SECRET_KEY: ${SECRET_KEY:?run scripts/init-env.sh}
      WORKERS: "2"
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      REVERSE_PROXY: "false"
    volumes:
      - uploads:/var/uploads
      - logs:/var/log/CTFd
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run scripts/init-env.sh}
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${DB_PASSWORD:?run scripts/init-env.sh}
      MARIADB_DATABASE: ctfd
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db:/var/lib/mysql
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - cache:/data

volumes:
  uploads:
  logs:
  db:
  cache:
