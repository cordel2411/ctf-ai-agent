[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-ai-agent"
version = "1.0.0"
description = "Benchmark an Amazon Bedrock (Claude) agent against a CTFd instance"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.40",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctf-agent = "ctf_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ctf_agent*"]

[tool.pytest.ini_options]
markers = ["integration: needs a running CTFd (set CTFD_TEST_URL)"]
